
<!doctype html>

<style>
  /* ============================================================
     Mercury × Flip7 Design System — donate.html
     ============================================================ */
  :root {
    --bg:        #EFF8F7;
    --surface:   #FFFFFF;
    --fg:        #111111;
    --muted:     #686868;
    --dim:       #888888;
    --border:    #D5D5D5;
    --accent:    #2BA8A2;
    --accent-l:  #3CC4BD;
    --accent-d:  #1E8C86;
    --gold:      #FFD23F;
    --gold-l:    #FFE47A;
    --gold-d:    #E6B800;
    --coral:     #EF6C4A;
    --cream:     #FFF8E7;
    --font-display: 'Playfair Display', Georgia, 'Iowan Old Style', serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* =============================================================
     SVG Background Layer — fragmented constellation
     ============================================================= */
  .bg-constellation {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* ---- Animation keyframes ---- */

  /* Slow drift for entire groups */
  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0); }
    25%  { transform: translate(6px, -4px); }
    50%  { transform: translate(-3px, 8px); }
    75%  { transform: translate(-7px, -2px); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0); }
    33%  { transform: translate(-8px, 3px); }
    66%  { transform: translate(4px, -6px); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0); }
    50%  { transform: translate(5px, 7px); }
  }

  /* Gentle pulse on select dots */
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.25; r: 3; }
    50%  { opacity: 0.55; r: 4.5; }
  }
  @keyframes pulse-dot-sm {
    0%, 100% { opacity: 0.18; r: 2; }
    50%  { opacity: 0.40; r: 3; }
  }
  @keyframes pulse-gold {
    0%, 100% { opacity: 0.30; r: 3.5; }
    50%  { opacity: 0.65; r: 5; }
  }

  /* Line shimmer — stroke-dashoffset cycle */
  @keyframes line-shimmer {
    0%   { stroke-dashoffset: 200; opacity: 0.20; }
    50%  { opacity: 0.45; }
    100% { stroke-dashoffset: 0; opacity: 0.20; }
  }
  @keyframes line-shimmer-rev {
    0%   { stroke-dashoffset: 0; opacity: 0.20; }
    50%  { opacity: 0.40; }
    100% { stroke-dashoffset: 200; opacity: 0.20; }
  }

  /* Ghost offset dot — subtle parallax illusion */
  @keyframes ghost-shift {
    0%, 100% { transform: translate(0, 0); opacity: 0.12; }
    50%  { transform: translate(-3px, 2px); opacity: 0.22; }
  }

  /* Rotate fragment group (extremely slow) */
  @keyframes slow-spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ---- Animation assignments ---- */
  .g-drift-a { animation: drift-a 28s ease-in-out infinite; }
  .g-drift-b { animation: drift-b 34s ease-in-out infinite; }
  .g-drift-c { animation: drift-c 22s ease-in-out infinite; }
  .g-spin    { animation: slow-spin 120s linear infinite; transform-origin: center center; }

  .dot-pulse    { animation: pulse-dot    5.5s ease-in-out infinite; }
  .dot-pulse-sm { animation: pulse-dot-sm 4.2s ease-in-out infinite; }
  .dot-pulse-au { animation: pulse-gold   6.0s ease-in-out infinite; }

  .line-shimmer    { animation: line-shimmer     8s linear infinite; }
  .line-shimmer-rev{ animation: line-shimmer-rev 9s linear infinite; }

  .ghost-dot { animation: ghost-shift 7s ease-in-out infinite; }

  /* Stagger delays */
  .dly-1 { animation-delay: 0s; }
  .dly-2 { animation-delay: -1.8s; }
  .dly-3 { animation-delay: -3.5s; }
  .dly-4 { animation-delay: -5.2s; }
  .dly-5 { animation-delay: -7.0s; }

  /* =============================================================
     Main card
     ============================================================= */
  .main {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    padding: 56px 48px 48px;
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .main::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }

  #i {
    display: block;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    margin: 0 auto 28px;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 8px rgba(43, 168, 162, 0.08);
  }

  .texts { margin-bottom: 36px; }

  #name {
    font-family: var(--font-display);
    font-size: 36px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--fg);
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  #description {
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
    max-width: 360px;
    margin: 0 auto;
  }

  .buttons { margin-top: 8px; }

  #depends {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    list-style: none;
  }

  #depends > span { display: none; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 48px;
    padding: 0 29px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.02em;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, transform 0.15s ease;
    white-space: nowrap;
    user-select: none;
    position: relative;
    z-index: 2;
  }

  .btn:active { transform: scale(0.97); }

  #toclick {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(43, 168, 162, 0.30);
  }
  #toclick:hover {
    background: var(--accent-l);
    border-color: var(--accent-l);
    box-shadow: 0 4px 24px rgba(60, 196, 189, 0.38);
  }
  #toclick:active {
    background: var(--accent-d);
    border-color: var(--accent-d);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  }

  #alipaybtn {
    background: var(--gold);
    color: var(--fg);
    border-color: var(--gold);
    box-shadow: 0 4px 20px rgba(255, 210, 63, 0.40);
  }
  #alipaybtn:hover {
    background: var(--gold-l);
    border-color: var(--gold-l);
    box-shadow: 0 4px 24px rgba(255, 228, 122, 0.45);
  }
  #alipaybtn:active {
    background: var(--gold-d);
    border-color: var(--gold-d);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
  }

  #paypalbtn {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
    box-shadow: none;
  }
  #paypalbtn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(43, 168, 162, 0.04);
  }
  #paypalbtn:active {
    color: var(--accent-d);
    border-color: var(--accent-d);
    background: rgba(43, 168, 162, 0.08);
  }

  .icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  #toclick .icon { fill: #FFFFFF; }
  #alipaybtn .icon { fill: var(--fg); }
  #paypalbtn .icon { fill: var(--muted); }
  #paypalbtn:hover .icon { fill: var(--accent); }

  /* ---- Modal ---- */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal.modal-active,
  .modal:target { display: flex; }

  .modal-container {
    background: var(--surface);
    width: 100%;
    max-width: 420px;
    padding: 40px 36px 36px;
    position: relative;
    text-align: center;
  }

  .modal-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    position: relative;
  }

  .modal-title {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: 0.02em;
    margin: 0 auto;
  }

  .btn-clear {
    position: absolute;
    top: -24px;
    right: -18px;
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    transition: color 0.15s;
    text-decoration: none;
    border-radius: 50%;
  }
  .btn-clear:hover {
    color: var(--fg);
    background: rgba(0,0,0,0.04);
  }
  .btn-clear::after {
    content: '×';
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 24px;
    line-height: 1;
  }

  #currentqrcode {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #currentqrcode img,
  #currentqrcode canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .footer-note {
    margin-top: 40px;
    font-family: var(--font-body);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .footer-note a {
    color: var(--dim);
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer-note a:hover { color: var(--accent); }

  /* ---- Responsive ---- */
  @media (max-width: 600px) {
    html, body {
      padding: 16px;
      align-items: flex-start;
      padding-top: 48px;
    }
    .main { padding: 40px 24px 36px; }
    #name { font-size: 28px; }
    #description { font-size: 14px; }
    #i { width: 96px; height: 96px; margin-bottom: 22px; }
    .btn { height: 44px; padding: 0 22px; font-size: 12px; }
    #depends { gap: 12px; }
    .modal-container { padding: 32px 20px 28px; }
    .btn-clear { top: -20px; right: -12px; }
  }

  @media (max-width: 380px) {
    #depends { flex-direction: column; gap: 10px; }
    .btn { width: 100%; }
  }
</style>
</head>

<!-- =========================================================
     SVG Background — fragmented constellation
     Inspired by deconstructivist graphic design:
     scattered nodes + connecting lines + ghost offsets
     ========================================================= -->
<svg class="bg-constellation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Teal glow filter for select nodes -->
    <filter id="glow-teal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==========================================
       Group A — dense cluster, upper-left quadrant
       Drifts slowly, main visual anchor
       ========================================== -->
  <g class="g-drift-a">
    <!-- Connecting lines — dashed, teal, low opacity -->
    <g stroke="#2BA8A2" stroke-width="1" fill="none" opacity="0.25">
      <line x1="120" y1="180" x2="260" y2="120" stroke-dasharray="8 6" class="line-shimmer dly-1" />
      <line x1="260" y1="120" x2="380" y2="200" stroke-dasharray="6 8" class="line-shimmer dly-2" />
      <line x1="120" y1="180" x2="200" y2="310" stroke-dasharray="10 5" class="line-shimmer dly-3" />
      <line x1="380" y1="200" x2="310" y2="340" stroke-dasharray="7 7" class="line-shimmer dly-4" />
      <line x1="200" y1="310" x2="310" y2="340" stroke-dasharray="5 9" class="line-shimmer dly-5" />
      <line x1="260" y1="120" x2="200" y2="310" stroke-dasharray="9 5" class="line-shimmer-rev dly-1" />
      <!-- Fragment: partial triangle -->
      <polyline points="380,200 460,150 430,230" stroke-dasharray="12 4" class="line-shimmer dly-3" />
    </g>

    <!-- Dots (nodes) — teal -->
    <g fill="#2BA8A2">
      <circle cx="120" cy="180" r="4" opacity="0.45" filter="url(#glow-teal)" class="dot-pulse dly-1" />
      <circle cx="260" cy="120" r="3.5" opacity="0.40" class="dot-pulse dly-2" />
      <circle cx="380" cy="200" r="3" opacity="0.35" class="dot-pulse-sm dly-3" />
      <circle cx="200" cy="310" r="2.5" opacity="0.30" class="dot-pulse-sm dly-4" />
      <circle cx="310" cy="340" r="3" opacity="0.38" class="dot-pulse-sm dly-5" />
      <!-- Fragment triangle vertices -->
      <circle cx="460" cy="150" r="2" opacity="0.28" class="dot-pulse-sm dly-1" />
      <circle cx="430" cy="230" r="2" opacity="0.28" class="dot-pulse-sm dly-1" />
      <!-- Stray dots near cluster -->
      <circle cx="90"  cy="140" r="2" opacity="0.22" />
      <circle cx="310" cy="80"  r="1.5" opacity="0.18" />
      <circle cx="420" cy="130" r="2.5" opacity="0.25" class="dot-pulse-sm dly-3" />
    </g>

    <!-- Ghost offset dots (错版影子效果) -->
    <g fill="#3CC4BD" opacity="0.10">
      <circle cx="126" cy="184" r="3.5" class="ghost-dot dly-1" />
      <circle cx="266" cy="124" r="3"   class="ghost-dot dly-2" />
      <circle cx="206" cy="314" r="2"   class="ghost-dot dly-3" />
    </g>

    <!-- One gold accent dot in this cluster -->
    <circle cx="260" cy="120" r="4" fill="#FFD23F" opacity="0.40" filter="url(#glow-gold)" class="dot-pulse-au dly-1" />
  </g>

  <!-- ==========================================
       Group B — sparse trail, right side
       Slow drift opposite direction
       ========================================== -->
  <g class="g-drift-b">
    <g stroke="#2BA8A2" stroke-width="0.8" fill="none" opacity="0.18">
      <line x1="1050" y1="250" x2="1180" y2="190" stroke-dasharray="6 8" class="line-shimmer dly-3" />
      <line x1="1180" y1="190" x2="1280" y2="280" stroke-dasharray="8 6" class="line-shimmer-rev dly-5" />
      <line x1="1050" y1="250" x2="1120" y2="380" stroke-dasharray="5 10" class="line-shimmer dly-2" />
      <line x1="1280" y1="280" x2="1200" y2="400" stroke-dasharray="7 7" class="line-shimmer dly-4" />
      <!-- Broken diagonal -->
      <line x1="1100" y1="160" x2="1220" y2="140" stroke-dasharray="4 8" class="line-shimmer dly-1" />
    </g>

    <g fill="#2BA8A2">
      <circle cx="1050" cy="250" r="3" opacity="0.32" class="dot-pulse-sm dly-3" />
      <circle cx="1180" cy="190" r="2.5" opacity="0.28" class="dot-pulse-sm dly-4" />
      <circle cx="1280" cy="280" r="2" opacity="0.22" />
      <circle cx="1120" cy="380" r="2.5" opacity="0.26" class="dot-pulse-sm dly-1" />
      <circle cx="1200" cy="400" r="1.8" opacity="0.20" />
      <circle cx="1100" cy="160" r="2" opacity="0.22" />
      <circle cx="1220" cy="140" r="1.5" opacity="0.16" />
      <!-- Stray far right -->
      <circle cx="1360" cy="320" r="2.5" opacity="0.24" class="dot-pulse-sm dly-5" />
      <circle cx="1320" cy="450" r="1.8" opacity="0.18" />
    </g>

    <g fill="#3CC4BD" opacity="0.09">
      <circle cx="1055" cy="253" r="2.5" class="ghost-dot dly-4" />
      <circle cx="1184" cy="193" r="2"   class="ghost-dot dly-5" />
    </g>
  </g>

  <!-- ==========================================
       Group C — bottom scattered dots + golds
       Slow drift, anchors button area visually
       ========================================== -->
  <g class="g-drift-c">
    <!-- Teal bottom dots -->
    <g fill="#2BA8A2">
      <circle cx="340" cy="660" r="3" opacity="0.28" class="dot-pulse-sm dly-2" />
      <circle cx="480" cy="720" r="2.5" opacity="0.24" />
      <circle cx="560" cy="640" r="2" opacity="0.20" class="dot-pulse-sm dly-4" />
      <circle cx="920" cy="690" r="2.5" opacity="0.22" class="dot-pulse-sm dly-1" />
      <circle cx="1040" cy="730" r="2" opacity="0.18" />
      <circle cx="780" cy="760" r="1.8" opacity="0.16" />
    </g>

    <!-- Gold accent dots at bottom — echo the Alipay button -->
    <g fill="#FFD23F">
      <circle cx="440" cy="680" r="3.5" opacity="0.35" filter="url(#glow-gold)" class="dot-pulse-au dly-3" />
      <circle cx="860" cy="710" r="3" opacity="0.28" filter="url(#glow-gold)" class="dot-pulse-au dly-5" />
    </g>

    <!-- Connecting line between gold dots -->
    <line x1="440" y1="680" x2="860" y2="710" stroke="#FFD23F" stroke-width="0.6" stroke-dasharray="4 12" opacity="0.15" class="line-shimmer-rev dly-2" />

    <!-- Subtle coral dot — very rare, one only -->
    <circle cx="630" cy="580" r="2" fill="#EF6C4A" opacity="0.20" class="dot-pulse-sm dly-4" />
  </g>

  <!-- ==========================================
       Group D — slow-rotating geometric fragment
       Upper right, barely perceptible
       ========================================== -->
  <g class="g-spin" style="transform-origin: 1200px 120px;">
    <g stroke="#2BA8A2" stroke-width="0.7" fill="none" opacity="0.15">
      <!-- Partial hexagon fragment -->
      <polyline points="1150,100 1190,70 1240,80 1270,120" stroke-dasharray="6 4" />
      <polyline points="1270,120 1240,160 1190,170" stroke-dasharray="4 6" />
    </g>
    <circle cx="1190" cy="70" r="2" fill="#2BA8A2" opacity="0.22" class="dot-pulse-sm dly-2" />
    <circle cx="1240" cy="80" r="1.5" fill="#2BA8A2" opacity="0.16" />
    <circle cx="1270" cy="120" r="2" fill="#2BA8A2" opacity="0.20" class="dot-pulse-sm dly-4" />
  </g>

  <!-- ==========================================
       Isolated tiny dots — noise texture
       Scattered across the full canvas at low opacity
       ========================================== -->
  <g fill="#2BA8A2" opacity="0.10">
    <circle cx="60"  cy="420" r="1.5" />
    <circle cx="180" cy="560" r="1" />
    <circle cx="700" cy="140" r="1.5" />
    <circle cx="880" cy="380" r="1" />
    <circle cx="1400" cy="500" r="1.5" />
    <circle cx="1350" cy="180" r="1" />
    <circle cx="100" cy="750" r="1.5" />
    <circle cx="1380" cy="650" r="1" />
    <circle cx="500" cy="480" r="1.2" />
    <circle cx="950" cy="550" r="1" />
  </g>
</svg>

<div class="main" id="h">
  <i id="i"></i>

  <div class="texts">

  <script>
    profile_error = 0;
    if (/\bhttps?:\/\/\S+/i.test(profile)) {
      profile_url = profile;
    } else if (/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i.test(profile)) {
      let profile_calc = 500 * (1 / window.devicePixelRatio) * 1.25;
      if (profile_calc > 500) { profile_size = 500; }
